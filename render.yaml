# Render Blueprint: one Node web service that serves the site + API,
# with a persistent disk for the database and uploads.
# Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: uicomponents
    runtime: node
    plan: starter            # disks need a paid plan; free instances lose all data on restart
    region: singapore        # closest to Bangladesh
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uicomponents-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      # Your public address, e.g. https://uicomponents.onrender.com (set after the first deploy).
      - key: SITE_URL
        sync: false
      # Used once to create the first admin, then delete ADMIN_PASSWORD in the dashboard.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
