# Publishes the static version of the site (built-in library, palette tool,
# Customize demo) to GitHub Pages on every push to main.
# No server here: the admin panel and uploaded content need the Node version.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static site
        run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          export BASE_PATH="/$REPO/" SITE_URL="https://$owner.github.io/$REPO"
          npm run build:pages
        env:
          VITE_STATIC: '1'
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
