<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Like Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- data-count sets the starting number. -->
    <button class="like-button" aria-pressed="false" data-count="128">
      <span class="like-button__heart" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" />
        </svg>
        <span class="like-button__burst"></span>
      </span>
      <span class="like-button__count">128</span>
    </button>

    <script src="script.js"></script>
  </body>
</html>
