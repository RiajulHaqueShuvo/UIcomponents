<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every element with class "spotlight-card" gets the effect. -->
    <div class="spotlight-card">
      <span class="spotlight-card__icon">⚡</span>
      <h3 class="spotlight-card__title">Lightning fast</h3>
      <p class="spotlight-card__text">
        Move your cursor over the card. A soft light follows it and the border glows.
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
